[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Aevum runs the Shanghai EVM: no MCOPY, TSTORE/TLOAD or blob opcodes.
# Never raise this to "cancun", or contracts that pass tests will fail on chain.
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Required by the multi-registry deploy script; still emits Shanghai-safe bytecode.
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
